<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Diagram Modal - Protection & Control Designer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom light scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900/40 backdrop-blur-sm h-screen w-screen flex items-center justify-center p-4 font-sans select-none antialiased">

  <!-- ======================================================== -->
  <!-- MODAL WINDOW CONTAINER (Light Contrast Design)           -->
  <!-- ======================================================== -->
  <div class="bg-white border border-slate-300 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[92vh]">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-900 tracking-wide">Create New Diagram Project</h2>
          <p class="text-[11px] text-slate-500 font-medium">Initialize a new Single Line Diagram (.pcd) with electrical base parameters</p>
        </div>
      </div>

      <!-- Close Button -->
      <button class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition-colors text-sm font-bold" title="Cancel">
        ✕
      </button>
    </div>

    <!-- Modal Body / Form Fields (Scrollable) -->
    <form class="p-6 overflow-y-auto space-y-5 text-xs text-slate-700">
      
      <!-- Section 1: File & Directory -->
      <div class="space-y-3">
        <span class="text-[11px] font-bold text-blue-700 uppercase tracking-wider">1. Project & File Location</span>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-800 font-semibold mb-1">Project Name <span class="text-rose-600">*</span></label>
            <div class="relative">
              <input type="text" value="Substation_San_Isidro_115kV" placeholder="Enter project name..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 font-mono font-medium">
              <span class="absolute right-3 top-2 text-blue-600 font-mono text-[11px] font-bold">.pcd</span>
            </div>
          </div>

          <div>
            <label class="block text-slate-800 font-semibold mb-1">Save Directory</label>
            <div class="flex gap-2">
              <input type="text" readonly value="C:\Users\ICIS\Documents\Simulador\Projects" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-600 font-mono truncate">
              <button type="button" class="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 font-semibold transition-colors shrink-0 shadow-2xs">
                Browse...
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Electrical Engineering Standards & Base Units -->
      <div class="space-y-3 pt-3 border-t border-slate-200">
        <span class="text-[11px] font-bold text-blue-700 uppercase tracking-wider">2. Electrical System Base Parameters</span>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          
          <!-- Standard -->
          <div>
            <label class="block text-slate-800 font-semibold mb-1">Protection Standard</label>
            <select class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-xs text-slate-900 font-medium focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
              <option value="IEEE">IEEE / ANSI (C37.2)</option>
              <option value="IEC">IEC (60909 / 60255)</option>
            </select>
          </div>

          <!-- Frequency (Yellow/Blue highlight) -->
          <div>
            <label class="block text-slate-800 font-semibold mb-1">Nominal Frequency</label>
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 border border-slate-200 rounded-lg">
              <label class="flex items-center justify-center gap-1.5 py-1 rounded bg-blue-600 text-white font-bold cursor-pointer shadow-2xs">
                <input type="radio" name="freq" value="60" checked class="hidden">
                <span>60 Hz</span>
              </label>
              <label class="flex items-center justify-center gap-1.5 py-1 rounded hover:bg-slate-200 text-slate-700 font-medium cursor-pointer">
                <input type="radio" name="freq" value="50" class="hidden">
                <span>50 Hz</span>
              </label>
            </div>
          </div>

          <!-- Base MVA -->
          <div>
            <label class="block text-slate-800 font-semibold mb-1">System Base Power</label>
            <div class="relative">
              <input type="number" value="100" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 font-mono font-bold focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
              <span class="absolute right-3 top-2 text-slate-500 font-semibold text-[11px]">MVA</span>
            </div>
          </div>

        </div>
      </div>

      <!-- Section 3: Initial Topology & Starter Template -->
      <div class="space-y-3 pt-3 border-t border-slate-200">
        <span class="text-[11px] font-bold text-blue-700 uppercase tracking-wider">3. Starting Topology Template</span>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          
          <!-- Option 1: Blank (Selected Blue) -->
          <label class="relative bg-blue-50/60 border-2 border-blue-600 rounded-xl p-3 flex flex-col justify-between cursor-pointer hover:bg-blue-50 transition-colors shadow-2xs">
            <input type="radio" name="template" value="blank" checked class="absolute top-3 right-3 text-blue-600">
            <div>
              <div class="text-blue-900 font-bold text-xs mb-1">Blank Canvas</div>
              <p class="text-[11px] text-slate-600 leading-relaxed">Start from scratch with an empty single-line workspace.</p>
            </div>
            <span class="mt-3 text-[10px] text-blue-700 font-mono font-semibold">0 Buses • Clean State</span>
          </label>

          <!-- Option 2: IEEE 9-Bus (Green Accent) -->
          <label class="relative bg-white border border-slate-200 hover:border-emerald-500 rounded-xl p-3 flex flex-col justify-between cursor-pointer hover:bg-emerald-50/30 transition-colors shadow-2xs">
            <input type="radio" name="template" value="ieee9" class="absolute top-3 right-3 text-emerald-600">
            <div>
              <div class="text-slate-900 font-bold text-xs mb-1">IEEE 9-Bus Benchmark</div>
              <p class="text-[11px] text-slate-500 leading-relaxed">3-generator transmission network ready for load flow.</p>
            </div>
            <span class="mt-3 text-[10px] text-emerald-700 font-mono font-semibold">9 Buses • 3 Generators</span>
          </label>

          <!-- Option 3: Radial Feeder (Yellow/Amber Accent) -->
          <label class="relative bg-white border border-slate-200 hover:border-amber-500 rounded-xl p-3 flex flex-col justify-between cursor-pointer hover:bg-amber-50/30 transition-colors shadow-2xs">
            <input type="radio" name="template" value="radial" class="absolute top-3 right-3 text-amber-500">
            <div>
              <div class="text-slate-900 font-bold text-xs mb-1">Radial Feeder 13.8kV</div>
              <p class="text-[11px] text-slate-500 leading-relaxed">Distribution line with recloser and fuse curve settings.</p>
            </div>
            <span class="mt-3 text-[10px] text-amber-800 font-mono font-semibold">ANSI 50/51 Pre-set</span>
          </label>

        </div>
      </div>

      <!-- Section 4: Engineering Notes / Metadata -->
      <div class="space-y-3 pt-3 border-t border-slate-200">
        <span class="text-[11px] font-bold text-blue-700 uppercase tracking-wider">4. Metadata & Notes (Optional)</span>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-800 font-semibold mb-1">Lead Protection Engineer</label>
            <input type="text" placeholder="e.g. John Doe / ICIS Protection Dept" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
          </div>

          <div>
            <label class="block text-slate-800 font-semibold mb-1">Description / Project Scope</label>
            <input type="text" placeholder="e.g. Substation bay expansion and relay retrofit" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
          </div>
        </div>
      </div>

    </form>

    <!-- Modal Footer Actions -->
    <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
      <div class="text-[11px] text-slate-600 flex items-center gap-1.5 font-medium">
      </div>

      <div class="flex items-center gap-3">
        <button type="button" class="px-4 py-2 rounded-lg bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold border border-slate-300 transition-colors shadow-2xs">
          Cancel
        </button>
        <button type="submit" class="px-5 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-700 hover:to-emerald-700 text-white font-bold text-xs shadow-md shadow-blue-200 transition-all flex items-center gap-1.5">
          <span>Create Project</span>
          <svg class="w-3.5 h-3.5 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
